# 키·모델 없이 mock 모드로 전체 흐름을 검증한다(Node.js·TypeScript·React).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # 매주 월요일 — 의존성·런타임이 바뀌어 깨지지 않았는지 정기 확인
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: mock
      - run: npm run build --if-present
      - run: npm start   # example migration + verify, no API key needed
