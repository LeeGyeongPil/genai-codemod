# Checks the whole flow in mock mode, with no API key and no model (Node.js + TypeScript).
name: ci
on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"   # every Monday: catch breakage from new dependency or runtime releases
  workflow_dispatch:
jobs:
  test:
    name: test (${{ matrix.os }}, Node ${{ matrix.node }})
    # Linux and macOS, oldest supported (22, see engines) and current LTS Node. fail-fast is off so a
    # failure shows whether it depends on the OS, on the Node version, or on neither (runner setup).
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ["22", "24"]
    runs-on: ${{ matrix.os }}
    # The suite takes 2-3 minutes; a stuck child process fails the job in 15 minutes instead of 6 hours
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: node --version && npm --version   # runtime versions at the top of a failure log
      - run: npm ci
      - run: npm test
        env:
          DEMO_MODE: mock
      - run: npm run build --if-present
      - run: npm start   # example migration + verify, no API key needed
